name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: bench --quick (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run bench -- --quick
      - name: Round-trip results match the committed ones
        shell: bash
        run: |
          node -e '
            const pick = (r) => JSON.stringify(r.roundtrip.map(({ file, engine, identical, pctChanged, wordsLost, error }) => ({ file, engine, identical, pctChanged, wordsLost, error })).concat(r.probes, r.edits));
            const now = require("./results/results.json");
            const committed = JSON.parse(require("child_process").execSync("git show HEAD:results/results.json", { encoding: "utf8", maxBuffer: 1 << 26 }));
            if (pick(now) !== pick(committed)) { console.error("Round-trip, probe or edit results differ from the committed results/results.json."); process.exit(1); }
            console.log("Round-trip, probe and edit results match the committed results.");
          '
